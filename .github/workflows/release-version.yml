name: Release version

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify tag and release metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/version.py check --tag "$RELEASE_TAG"
